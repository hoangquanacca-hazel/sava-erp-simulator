# Netlify config for Savafinlab MTO ERP Simulator (Vite SPA + Functions)
[build]
  command = "npx vite build && node scripts/verify-reporting-release.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API routes -> functions (evaluated before the SPA catch-all)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/copilot"
  to = "/.netlify/functions/copilot"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Keep the static Simulated Native pilot page ahead of the SPA catch-all.
[[redirects]]
  from = "/sap-reporting/simulated-native"
  to = "/sap-reporting/simulated-native/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sap-reporting/simulated-native/"
  to = "/sap-reporting/simulated-native/index.html"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
