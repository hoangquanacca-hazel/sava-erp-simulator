  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <!-- Netlify Forms: build-time detection form. The React LeadCaptureModal POSTs to name="lead".
         Submissions appear in Netlify > Forms > lead (and via email notifications). -->
    <form name="lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="role" />
      <input type="text" name="company" />
      <input type="text" name="receiveMaterials" />
      <input type="text" name="consentPolicy" />
      <input type="text" name="registeredAt" />
      <input type="text" name="source" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
