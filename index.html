<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="SAVA Precision Technology — Mô phỏng quy trình sản xuất theo đơn hàng Make-to-Order (MTO) tích hợp SD-MM-PP-QM-FICO theo Thông tư 99/2025/TT-BTC." />
    <meta property="og:title" content="Sava ERP Cockpit | Savafinlab" />
    <meta property="og:description" content="SAVA Precision Technology — Mô phỏng quy trình sản xuất theo đơn hàng Make-to-Order (MTO) tích hợp SD-MM-PP-QM-FICO theo Thông tư 99/2025/TT-BTC." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- SAVA-BRAND v1 (3 thẻ + <sava-bar> sau <body>): chèn lại nếu index.html bị thay -->
    <link rel="icon" href="https://www.savafinlab.com.vn/brand/v1/logo-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://www.savafinlab.com.vn/brand/v1/brand.css">
    <script src="https://www.savafinlab.com.vn/brand/v1/sava-bar.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <sava-bar product="Sava ERP Cockpit"></sava-bar>
    <!-- Netlify Forms: build-time detection form. The React LeadCaptureModal POSTs to name="lead".
         Submissions appear in Netlify > Forms > lead (and via email notifications). -->
    <form name="lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="role" />
      <input type="text" name="company" />
      <input type="text" name="receiveMaterials" />
      <input type="text" name="consentPolicy" />
      <input type="text" name="registeredAt" />
      <input type="text" name="source" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
